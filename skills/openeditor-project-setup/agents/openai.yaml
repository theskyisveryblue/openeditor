  short_description: "Infer and generate OpenEditor config, including source-only Swift classification"
  default_prompt: "Use $openeditor-project-setup to inspect this repo, create or update .logic-editor.json, oe-tests.json, and oe-swift.json when needed, infer requiredPorts, include meaningful route, param, and state variants for previews and tests, and classify Swift/iOS output as preview-ready or source-only."
